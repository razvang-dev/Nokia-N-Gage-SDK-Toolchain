name: Populate repository from v1.0.0 release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download complete v1.0.0 toolchain release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ngage-release

          gh release download v1.0.0 \
            --pattern '*.tar.xz.tar' \
            --dir /tmp/ngage-release

          echo "Downloaded release files:"
          ls -lah /tmp/ngage-release

      - name: Extract toolchain into repository
        run: |
          set -euo pipefail

          archive="$(find /tmp/ngage-release -maxdepth 1 -type f -name '*.tar.xz.tar' -print -quit)"

          if [ -z "$archive" ]; then
            echo "ERROR: Toolchain release archive was not found."
            exit 1
          fi

          echo "Using archive: $archive"

          tar -xJf "$archive" \
            --strip-components=1 \
            -C .

          rm -f GITHUB_UPLOAD_GUIDE.md

      - name: Verify GitHub file-size limit
        run: |
          set -euo pipefail

          oversized="$(find . -path './.git' -prune -o -type f -size +99M -print)"

          if [ -n "$oversized" ]; then
            echo "Files too large for normal GitHub storage:"
            printf '%s\n' "$oversized"
            exit 1
          fi

      - name: Commit complete toolchain tree
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -f -A

          if git diff --cached --quiet; then
            echo "Repository is already populated."
            exit 0
          fi

          git commit -m 'Add complete Nokia N-Gage SDK toolchain tree'
          git push origin HEAD:main
